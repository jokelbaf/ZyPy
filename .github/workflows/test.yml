name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.13", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.13", args: --ignore=tests/packaging/test_cross_compiling.py }
          - { os: ubuntu-24.04-arm, python: "3.13", args: --ignore=tests/packaging/test_cross_compiling.py }
          - { os: ubuntu-latest, python: 3.14t, tests: tests/library }
          - { os: ubuntu-24.04-arm, python: 3.14t, tests: tests/library }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - if: ${{ !matrix.tests }}
        run: uv python install 3.13 3.14
      - run: uv run pytest --durations=10 ${{ matrix.tests }} ${{ matrix.args }}

  musllinux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      ZYPY_DOCKER_TESTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv run pytest --durations=10 tests/packaging/test_platforms.py::test_musllinux_wheel
