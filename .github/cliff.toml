[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jokelbaf/ZyPy/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}{% if previous.version %}
**Full changes:** [{{ previous.version }}...{{ version }}](https://github.com/jokelbaf/ZyPy/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
sort_commits = "newest"
tag_pattern = "v[0-9].*"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^doc", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^ci", group = "<!-- 6 -->CI" },
    { message = "^chore|^build|^style", group = "<!-- 7 -->Other changes" },
]
